name: Tests Backend

on:
  push:
    branches: ["**"]          # tous les branches
    paths:
      - "backend/**"          # uniquement si le backend change
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    name: JUnit — Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Rendre gradlew exécutable
        run: chmod +x backend/gradlew

      - name: Lancer les tests
        run: ./gradlew test
        working-directory: backend

      - name: Publier le rapport de tests
        uses: actions/upload-artifact@v4
        if: always()           # publié même en cas d'échec
        with:
          name: rapport-tests
          path: backend/build/reports/tests/test/
          retention-days: 14
